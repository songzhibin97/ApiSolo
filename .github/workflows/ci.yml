name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Rust tests
        run: npm run test:rust

  # Dependency audits run in their own job so new dependency advisories stay separate
  # from test and build regression signals.
  audit:
    name: Dependency audit
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm run audit

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        run: npm run audit:cargo

  package-macos:
    name: Build unsigned macOS app
    runs-on: macos-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build macOS bundle
        run: CI=true npm run tauri:build

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: ApiSolo-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ApiSolo-macos-app
          path: src-tauri/target/release/bundle/macos/*.app
