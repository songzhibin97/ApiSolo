<!doctype html>
<html lang="zh-CN" data-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApiSolo</title>
  </head>

  <body>
    <script>
      // Prevent theme flash: apply saved theme before Vue loads
      try {
        var s = JSON.parse(localStorage.getItem('apisolo:settings') || '{}');
        var t = s.theme === 'light' ? 'light' : s.theme === 'system'
          ? (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light')
          : 'dark';
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch(e) {}
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
